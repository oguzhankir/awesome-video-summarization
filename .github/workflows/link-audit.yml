name: External link audit
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths: ['**/*.md', 'data/**', 'scripts/audit_links.py', '.github/workflows/link-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/audit_links.py --output link-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-link-report
          path: link-report.json
